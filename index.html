<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Skardela: free daily puzzles of new types. No account, no download."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Skardela</title>
    <!-- This sets the saved theme before the page shows, so the page does not flash. It must use the same key and values as "src/shared/theme.ts". -->
    <script>
      try {
        var theme = localStorage.getItem("skardela-theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch (error) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <noscript>Skardela needs JavaScript. Turn on JavaScript to play.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
