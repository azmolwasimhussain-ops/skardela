# This workflow runs all project checks on each push to main and on each pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Give the workflow read access only.
permissions:
  contents: read

# Stop old runs on the same branch when a new commit arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      # Use the Node.js version from .nvmrc.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Run format, lint, type, test, validate and build checks.
      - name: Run checks
        run: npm run check
