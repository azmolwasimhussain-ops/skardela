# This form collects the data that we need to find and fix a bug.
name: Bug report
description: Tell us about a problem in Skardela.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for this report. Before you send it, make sure that no other issue reports the same bug.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Tell us what the problem is.
      placeholder: When I click the reset button, the puzzle does not clear.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Write the steps that cause the problem.
      placeholder: |
        1. Go to the home page.
        2. Click "Start".
        3. See the error.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: Tell us what must occur.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Tell us what occurs. Add screenshots or console errors if you have them.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Firefox 140
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 26
  - type: dropdown
    id: device
    attributes:
      label: Device type
      options:
        - Desktop
        - Mobile
        - Tablet
  - type: textarea
    id: context
    attributes:
      label: Other information
      description: Add other data that can help us.
